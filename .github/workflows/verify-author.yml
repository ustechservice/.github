name: Verify commit authors (USTech reusable)

# Reusable callable workflow. Invoke from any USTech repo with:
#
#   # .github/workflows/verify-author.yml
#   name: Verify commit authors
#   on:
#     push:
#       branches: ["**"]
#     pull_request:
#   jobs:
#     call:
#       uses: ustechservice/.github/.github/workflows/verify-author.yml@v1
#
# Optionally override the required email per-repo:
#
#   jobs:
#     call:
#       uses: ustechservice/.github/.github/workflows/verify-author.yml@v1
#       with:
#         required_email: ops@ustechservice.com

on:
  workflow_call:
    inputs:
      required_email:
        description: Email every commit author must match.
        type: string
        required: false
        default: webmaster@ustechservice.com

jobs:
  verify-author:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify commit authors
        env:
          REQUIRED_EMAIL: ${{ inputs.required_email }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -e
          ZERO="0000000000000000000000000000000000000000"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # Normal push (before is missing after a force-push that dropped it; fall through)
            RANGE="$BEFORE..$HEAD_SHA"
          elif [ -n "$DEFAULT_BRANCH" ] && [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]                && git rev-parse -q --verify "origin/$DEFAULT_BRANCH" >/dev/null; then
            # First push of a new branch (before is all zeros): only the commits the
            # branch adds on top of the default branch. Using the bare SHA here walked
            # the entire history and failed on every pre-guard commit.
            RANGE="origin/$DEFAULT_BRANCH..$HEAD_SHA"
          else
            # First push of the default branch itself, or no default branch to compare to.
            RANGE="$HEAD_SHA"
          fi

          echo "Inspecting range: $RANGE"
          echo "Required author email: $REQUIRED_EMAIL"
          echo ""

          BAD=0
          while IFS='|' read -r SHA EMAIL SUBJ; do
            if [ "$EMAIL" != "$REQUIRED_EMAIL" ]; then
              echo "::error::Commit $SHA has wrong author: $EMAIL ($SUBJ)"
              BAD=$((BAD + 1))
            else
              echo "✓ $SHA  $EMAIL  $SUBJ"
            fi
          # tformat (not format): newline-terminates every line. With format:, the last
          # line has no newline, `read` drops it, and the oldest commit in the range was
          # never checked — so a single-commit wrong-author push always passed.
          done < <(git log --pretty=tformat:'%H|%ae|%s' "$RANGE")

          if [ "$BAD" -gt 0 ]; then
            echo ""
            echo "::error::$BAD commit(s) have the wrong author email."
            echo "::error::Vercel rejects these. Rewrite with:"
            echo "::error::  git rebase --exec \"git commit --amend --no-edit --reset-author\" <base>"
            echo "::error::  git push --force-with-lease"
            exit 1
          fi

          echo ""
          echo "All commits verified."
